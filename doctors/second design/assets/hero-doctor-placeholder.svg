<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="رسم توضيحي لطبيب">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16224a"/>
      <stop offset="100%" stop-color="#0b1431"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#d7e3fb"/>
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39B8FF"/>
      <stop offset="100%" stop-color="#4F7BFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39B8FF"/>
      <stop offset="100%" stop-color="#785DFF"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#39B8FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#39B8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="520" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="399" height="519" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <circle cx="200" cy="230" r="190" fill="url(#glowGrad)"/>
  <circle cx="200" cy="230" r="150" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="200" cy="230" r="118" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- body / coat -->
  <path d="M112 470c0-58 40-96 88-96s88 38 88 96" fill="url(#coatGrad)"/>
  <path d="M112 470c0-58 40-96 88-96s88 38 88 96" fill="none" stroke="rgba(11,20,49,0.15)" stroke-width="1"/>
  <!-- scrub / undershirt -->
  <path d="M172 382c0 0 12 14 28 14s28-14 28-14l-6 40h-44Z" fill="url(#scrubGrad)"/>
  <!-- coat lapels -->
  <path d="M170 380 152 470M230 380 248 470" stroke="rgba(11,20,49,0.18)" stroke-width="2" stroke-linecap="round"/>
  <!-- stethoscope -->
  <path d="M150 388c0 22 10 34 26 34M250 388c0 22-10 34-26 34" fill="none" stroke="#0b1431" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="200" cy="424" r="9" fill="none" stroke="#0b1431" stroke-width="5" opacity="0.55"/>

  <!-- neck -->
  <rect x="184" y="352" width="32" height="30" rx="12" fill="#f2c9a1"/>
  <!-- head -->
  <circle cx="200" cy="318" r="46" fill="#f5d3ab"/>
  <!-- hair -->
  <path d="M156 306c0-30 20-52 44-52s44 22 44 52c0-8-6-14-10-14-6-14-20-22-34-22s-28 8-34 22c-4 0-10 6-10 14Z" fill="#2c2440"/>

  <!-- id badge -->
  <rect x="176" y="404" width="26" height="16" rx="3" fill="#ffffff" opacity="0.85"/>
  <rect x="180" y="408" width="18" height="3" rx="1.5" fill="#4F7BFF"/>
  <rect x="180" y="413" width="12" height="2.5" rx="1.25" fill="#9db4e6"/>

  <!-- floating medical accents -->
  <g opacity="0.85">
    <circle cx="86" cy="150" r="20" fill="rgba(57,184,255,0.12)"/>
    <path d="M86 140v20M76 150h20" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g opacity="0.85">
    <circle cx="322" cy="180" r="17" fill="rgba(120,93,255,0.12)"/>
    <path d="M313 180h18M317 173l4 14 4-9 3 6" fill="none" stroke="url(#accentGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g opacity="0.7">
    <circle cx="70" cy="420" r="14" fill="rgba(57,184,255,0.1)"/>
    <path d="M63 420h14M70 413v14" stroke="url(#accentGrad)" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
